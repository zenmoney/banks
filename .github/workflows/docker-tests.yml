name: Docker tooling tests

on:
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/docker-tests.yml'
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Docker helper tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Run isolated Git cleanup tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: /usr/bin/python3 -m unittest discover -s docker/tests -p 'test_*.py' -v
