name: Docker tooling tests

on:
  pull_request:
    paths:
      - 'docker/**'
      - 'compose*.yaml'
      - '.env.example'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-tests.yml'
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'compose*.yaml'
      - '.env.example'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Docker helper tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install launcher test dependencies
        run: |
          /usr/bin/python3 -m venv /tmp/docker-tests-venv
          /tmp/docker-tests-venv/bin/pip install -r docker/requirements.txt
      - name: Run isolated launcher and cleanup tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: /tmp/docker-tests-venv/bin/python -m unittest discover -s docker/tests -p 'test_*.py' -v
