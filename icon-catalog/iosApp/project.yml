name: IconCatalogIOS
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  IconCatalogIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/IconCatalogApp.swift
      - path: Sources/NativeCatalogView.swift
      - path: Generated/Assets.xcassets
        buildPhase: resources
      - path: Generated/native-manifest.json
        buildPhase: resources
    preBuildScripts:
      - name: Generate native assets and build Compose framework
        script: bash "$SRCROOT/build_framework.sh" build
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.zen.iconcatalog
        PRODUCT_NAME: IconCatalogIOS
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../catalog/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "IconCatalog", "-ObjC"]
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
schemes:
  IconCatalogIOS:
    build:
      targets:
        IconCatalogIOS: all
    run:
      config: Debug
    archive:
      config: Release
